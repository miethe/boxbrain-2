              type: array
              items: { $ref: '#/components/schemas/Comment' }
            notes:
              type: array
              items: { $ref: '#/components/schemas/Note' }
    ContentUnitUsageReference:
      type: object
      required: [objectType, objectId, title]
      properties:
        objectType:
          type: string
          enum: [content_block_version, storyboard, work_product_version]
        objectId: { type: string, format: uuid }
        title: { type: string }
        orderIndex: { type: integer, nullable: true }
        memberId: { type: string, format: uuid, nullable: true }
        sectionId: { type: string, format: uuid, nullable: true }
        slotId: { type: string, format: uuid, nullable: true }
        workProductVersionId: { type: string, format: uuid, nullable: true }
    WorkProductFamilyCard:
      type: object
      required: [id, title, artifactType]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artifactType: { type: string }
        summary: { type: string, nullable: true }
        previewUri: { type: string, nullable: true }
        variantCount: { type: integer }
        versionCount: { type: integer }
        statusChips: { $ref: '#/components/schemas/StatusChips' }
    WorkProductVersionDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artifactType: { type: string }
        versionNumber: { type: string }
        approvalState: { $ref: '#/components/schemas/ApprovalState' }
        previewUri: { type: string, nullable: true }
        statusChips: { $ref: '#/components/schemas/StatusChips' }
