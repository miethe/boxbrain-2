      properties:
        title: { type: string }
        summary: { type: string }
        orderIndex: { type: integer }
    CreateStoryboardSlotRequest:
      type: object
      required: [slotType]
      properties:
        slotType: { type: string, enum: [content_unit, content_block, work_product_ref, gap] }
        selectedObjectType: { type: string, nullable: true }
        selectedObjectId: { type: string, format: uuid, nullable: true }
        orderIndex: { type: integer }
        purpose: { type: string }
        isRequired: { type: boolean, default: true }
    UpdateStoryboardSlotRequest:
      type: object
      properties:
        slotType: { type: string, enum: [content_unit, content_block, work_product_ref, gap] }
