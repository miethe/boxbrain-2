        unitType: { type: string }
        canonicalPreviewUri: { type: string, nullable: true }
        variantCount: { type: integer }
        versionCount: { type: integer }
        taxonomy: { $ref: '#/components/schemas/Taxonomy' }
        statusChips: { $ref: '#/components/schemas/StatusChips' }
    ContentUnitFamilyDetail:
      allOf:
        - $ref: '#/components/schemas/ContentUnitFamilyCard'
        - type: object
          properties:
            variants:
              type: array
              items: { $ref: '#/components/schemas/ContentUnitVariant' }
            notes:
              type: array
              items: { $ref: '#/components/schemas/Note' }
    ContentUnitVariant:
      type: object
      required: [id, familyId, variantLabel, isCanonical]
      properties:
        id: { type: string, format: uuid }
        familyId: { type: string, format: uuid }
        variantLabel: { type: string }
        variantType: { type: string }
        variantDimensions: { type: object, additionalProperties: true }
        isCanonical: { type: boolean }
        linkedBy: { type: string, enum: [manual, ai, hybrid] }
        linkedConfidence: { type: number, nullable: true }
        latestVersionId: { type: string, format: uuid, nullable: true }
        latestVersion:
          anyOf:
            - $ref: '#/components/schemas/ContentUnitVersion'
            - type: 'null'
    ContentUnitVersion:
      type: object
      required: [id, variantId, versionNumber, approvalState]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        versionNumber: { type: string }
        renderUri: { type: string, nullable: true }
        thumbnailUri: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        approvalState: { $ref: '#/components/schemas/ApprovalState' }
        freshnessState: { $ref: '#/components/schemas/FreshnessState' }
        qualityScore: { type: number, nullable: true }
        usageScore: { type: number, nullable: true }
        sourceOrderIndex: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    ContentUnitVersionDetail:
      allOf:
        - $ref: '#/components/schemas/ContentUnitVersion'
