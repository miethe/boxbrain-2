        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AdminHealth:
      type: object
      properties:
        status: { type: string }
        contentUnitFamilies: { type: integer }
        contentUnitVersions: { type: integer }
