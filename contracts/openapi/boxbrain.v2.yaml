          type: string
          enum: [family, variant, version, block, work_product, play]
        title: { type: string }
        summary: { type: string, nullable: true }
        previewUri: { type: string, nullable: true }
        score: { type: number }
        explanationChips:
          type: array
          items: { type: string }
        statusChips: { $ref: '#/components/schemas/StatusChips' }
    CreateContentBlockRequest:
      type: object
      required: [title, members]
      properties:
        title: { type: string }
        summary: { type: string, nullable: true }
        blockType: { type: string, default: sequence }
        members:
          type: array
          items:
            type: object
            required: [memberType, memberId, orderIndex]
