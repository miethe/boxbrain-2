          type: array
          items: { $ref: '#/components/schemas/ContentUnitVersion' }
        provenance: { $ref: '#/components/schemas/ProvenanceRecord' }
    ProvenanceRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        originType: { type: string }
        sourceSystem: { type: string, nullable: true }
        parentRefs: { type: array, items: { type: object } }
        sourceRefs: { type: array, items: { type: string } }
        modelInfo: { type: string, nullable: true }
        pipelineVersion: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        profile:
          type: string
          enum: [general, executive, technical, opportunity, duplicate_review, similarity_review, approved_only]
          default: general
        objectTypes:
          type: array
          items:
            type: string
            enum:
              - content_unit
              - content_units
              - content_unit_family
              - content_unit_variant
              - content_unit_version
              - work_product
              - work_products
              - work_product_family
              - work_product_version
              - content_block
              - content_blocks
              - content_block_family
              - content_block_variant
              - content_block_version
        filters:
          type: object
          additionalProperties: true
        resultMode:
          type: string
          enum: [auto, families, variants, versions]
          default: auto
        limit:
          type: integer
          default: 20
    AskRequest:
      allOf:
        - $ref: '#/components/schemas/SearchRequest'
        - type: object
          properties:
            context:
              type: object
              additionalProperties: true
    SearchResponse:
      type: object
      required: [query, items]
      properties:
        query: { type: string }
        interpretedIntent: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResultItem' }
        debug:
          type: object
          additionalProperties: true
          nullable: true
    SearchResultItem:
      type: object
      properties:
        objectType: { type: string }
        objectId: { type: string, format: uuid }
