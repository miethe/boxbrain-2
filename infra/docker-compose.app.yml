# BoxBrain v2 full application stack
# Usage: docker compose --env-file .env.example -f infra/docker-compose.app.yml up -d --build

name: boxbrain-app

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-container}
  AUTH_MODE: ${AUTH_MODE:-dev}
  BOXBRAIN_REPOSITORY: database
  BOXBRAIN_STORAGE: s3
  BOXBRAIN_ENQUEUE_INGESTION: "true"
  BOXBRAIN_DB_SCHEMA: ${BOXBRAIN_DB_SCHEMA:-boxbrain}
  BOXBRAIN_RENDERER: ${BOXBRAIN_RENDERER:-libreoffice}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-boxbrain}:${POSTGRES_PASSWORD:-boxbrain}@postgres:5432/${POSTGRES_DB:-boxbrain}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-boxbrain-artifacts}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-boxbrain}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-boxbrain-secret}}
  S3_REGION: ${S3_REGION:-us-east-1}
  LIBREOFFICE_BIN: ${LIBREOFFICE_BIN:-soffice}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boxbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxbrain}
      POSTGRES_DB: ${POSTGRES_DB:-boxbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - boxbrain_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-boxbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-boxbrain-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - boxbrain_app_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  create-minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-boxbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-boxbrain-secret}
      S3_BUCKET: ${S3_BUCKET:-boxbrain-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${S3_BUCKET} || true;
      mc anonymous set none local/$${S3_BUCKET};
      exit 0;
      "

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app-env
    # Single worker is mandatory in database mode: the repository is a per-process
    # in-memory cache with no cross-process invalidation. See
    # docs/deployment/containerized-quick-start.md.
    command:
      ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-minio-bucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-minio-bucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "rq", "worker", "boxbrain-ingestion", "--url", "redis://redis:6379/0"]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
        # Baked into the standalone rewrite manifest at build time (see Dockerfile); server-side
        # proxy targets the in-network API, independent of the host-facing NEXT_PUBLIC port.
        BOXBRAIN_API_PROXY_TARGET: ${BOXBRAIN_API_PROXY_TARGET:-http://api:8000}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
      BOXBRAIN_SERVER_API_BASE_URL: http://api:8000
      # Next.js /api/* rewrite proxy runs server-side; target the in-network API, not localhost.
      BOXBRAIN_API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["opensearch"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-boxbrain-Admin-123!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - boxbrain_app_opensearch_data:/usr/share/opensearch/data

volumes:
  boxbrain_app_postgres_data:
  boxbrain_app_minio_data:
  boxbrain_app_opensearch_data:
