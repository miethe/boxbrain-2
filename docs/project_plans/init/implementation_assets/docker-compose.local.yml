# BoxBrain v2 local development services
# Usage: docker compose -f implementation_assets/docker-compose.local.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: boxbrain-postgres
    environment:
      POSTGRES_USER: boxbrain
      POSTGRES_PASSWORD: boxbrain
      POSTGRES_DB: boxbrain
    ports:
      - "5432:5432"
    volumes:
      - boxbrain_postgres_data:/var/lib/postgresql/data
      - ./initial_db_schema.sql:/docker-entrypoint-initdb.d/001_initial_db_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxbrain -d boxbrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boxbrain-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: boxbrain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boxbrain
      MINIO_ROOT_PASSWORD: boxbrain-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - boxbrain_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  create-minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 boxbrain boxbrain-secret;
      mc mb -p local/boxbrain-artifacts || true;
      mc anonymous set none local/boxbrain-artifacts;
      exit 0;
      "

  # Optional later-scale search service. Keep disabled for MVP unless needed.
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: boxbrain-opensearch
    profiles: ["opensearch"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: boxbrain-Admin-123!
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - boxbrain_opensearch_data:/usr/share/opensearch/data

volumes:
  boxbrain_postgres_data:
  boxbrain_minio_data:
  boxbrain_opensearch_data:
