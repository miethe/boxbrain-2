  skillbom:
    id: skill_html_capsule_generator_v0
    name: HTML Capsule Generator
    version: 0.1.0
    owner: Nick Miethe
    posture: implementer
    purpose: Generate safe, self-contained HTML capsules from canonical Markdown and structured data.
    inputs:
      - source.md
      - capsule.manifest.yaml
      - evidence.json
      - optional screenshots
      - optional git diff
    required_context_packs:
      - agentic_operating_system_core
      - meatywiki_memory_model
      - ccdash_execution_event_schema
    outputs:
      - index.html
      - writeback.bundle.json
    validation:
      - no_external_scripts
      - canonical_source_preserved
      - writeback_bundle_generated
      - safe_html_mode
      - human_review_required
    known_failure_modes:
      - pretty_but_weak_analysis
      - source_of_truth_confusion
      - unsafe_javascript
      - inconsistent_layout
      - excessive_scope
    metrics:
      - review_acceptance_rate
      - writeback_acceptance_rate
      - reuse_count
      - time_to_understand_run
      - rework_count

  skill_card:
    promotion_status: candidate
    usage_evidence:
